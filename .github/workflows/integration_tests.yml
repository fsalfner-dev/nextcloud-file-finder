name: Integration Tests

on:
  workflow_dispatch:

env:
  APP_NAME: filefinder

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server-versions: ['32', '33', '34']
    name: Version-${{ matrix.server-versions }}
    steps:
      - name: Checkout the app
        uses: actions/checkout@v4

      - name: Build the app
        run: |
          npm i
          npm run build

      - name: Start containers
        env:
          NEXTCLOUD_VERSION: ${{ matrix.server-versions }}
        run: |
          docker compose -f tests/integration/compose.yml up -d

      - name: Wait for Nextcloud
        run: |
          until curl -fs http://localhost:8080/status.php; do
            sleep 2
          done

      - name: Copy app into Nextcloud
        env:
          NEXTCLOUD_VERSION: ${{ matrix.server-versions }}
        run: |
          docker cp \
            "$GITHUB_WORKSPACE" \
            $(docker compose -f tests/integration/compose.yml ps -q nextcloud):/var/www/html/apps/${APP_NAME}

      - name: Set permissions
        env:
          NEXTCLOUD_VERSION: ${{ matrix.server-versions }}
        run: |
          docker compose -f tests/integration/compose.yml exec -T nextcloud \
            chown -R www-data:www-data /var/www/html/apps/${APP_NAME}

      - name: Setup Nextcloud
        env:
          NEXTCLOUD_VERSION: ${{ matrix.server-versions }}
        run: |
          docker compose -f tests/integration/compose.yml exec -T --user www-data nextcloud \
            php occ maintenance:install \
              --database mysql \
              --database-host db \
              --database-name nextcloud \
              --database-user nextcloud \
              --database-pass nextcloud \
              --admin-user admin \
              --admin-pass admin

          # Setup fulltext search
          docker compose -f tests/integration/compose.yml exec -T --user www-data nextcloud php occ app:install fulltextsearch
          docker compose -f tests/integration/compose.yml exec -T --user www-data nextcloud php occ app:install fulltextsearch_elasticsearch
          docker compose -f tests/integration/compose.yml exec -T --user www-data nextcloud php occ app:install files_fulltextsearch
          
          # temporary fix for bug in Nextcloud fulltextsearch
          docker compose -f tests/integration/compose.yml exec -T --user www-data nextcloud sed -i 's/setAppValueBool($k, $save\[$k/setAppValueBool($k, (bool)$save\[$k/g' custom_apps/fulltextsearch/lib/Service/ConfigService.php

          # configure fulltextsearch
          docker compose -f tests/integration/compose.yml exec -T --user www-data nextcloud php occ fulltextsearch:configure '{"search_platform":"OCA\\FullTextSearch_Elasticsearch\\Platform\\ElasticSearchPlatform"}'
          docker compose -f tests/integration/compose.yml exec -T --user www-data nextcloud php occ fulltextsearch_elasticsearch:configure '{"elastic_host":"http://elasticsearch:9200", "elastic_index":"testindex"}'

          # run index once for testing
          docker compose -f tests/integration/compose.yml exec -T --user www-data nextcloud php occ fulltextsearch:index


      - name: Enable filefinder app
        env:
          NEXTCLOUD_VERSION: ${{ matrix.server-versions }}
        run: |
          docker compose -f tests/integration/compose.yml exec -T --user www-data nextcloud \
            php occ app:enable ${APP_NAME}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: phpunit

      - name: Set up PHPUnit
        run: |
          composer require --dev phpunit/phpunit
          composer require --dev guzzlehttp/guzzle

      - name: Run tests with fulltext search
        env:
          NEXTCLOUD_URL: http://localhost:8080
        run: ./vendor/bin/phpunit -c tests/phpintegration.xml --testsuite integration_fulltext --display-warnings

      - name: Disable Fulltext search
        env:
          NEXTCLOUD_VERSION: ${{ matrix.server-versions }}
        run: |
          docker compose -f tests/integration/compose.yml exec -T --user www-data nextcloud php occ app:disable fulltextsearch

      - name: Run tests with file search backend
        env:
          NEXTCLOUD_URL: http://localhost:8080
        run: ./vendor/bin/phpunit -c tests/phpintegration.xml --testsuite integration_files --display-warnings


      - name: Shut down compose
        if: ${{ always() }}
        env:
          NEXTCLOUD_VERSION: ${{ matrix.server-versions }}
        run: docker compose -f tests/integration/compose.yml down 
            