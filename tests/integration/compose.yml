services:
  db:
    image: mariadb
    platform: linux/arm64
    container_name: integration_db
    environment:
      MYSQL_ROOT_PASSWORD: nextcloud
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-unextcloud", "-pnextcloud"]
      interval: 5s
      timeout: 5s
      retries: 20

  nextcloud:
    image: nextcloud:32-apache
    container_name: integration_nextcloud
    platform: linux/arm64
    depends_on:
      db:
        condition: service_healthy
#      elasticsearch:
#        condition: service_healthy

    ports:
      - "8080:80"

    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud

  php_debug:
    build:
      context: .
      dockerfile: Dockerfile.debug
    volumes:
      - .:/app

